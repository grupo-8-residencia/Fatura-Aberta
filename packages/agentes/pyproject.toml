[project]
name = "fa-agentes"
version = "0.1.0"
description = "Agentes (F5): Analista Normativo e Auditor."
requires-python = ">=3.12"
dependencies = ["fa-contratos"]

[tool.uv.sources]
fa-contratos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fa_agentes"]
