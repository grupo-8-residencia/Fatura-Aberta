repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe] # mkdocs.yml usa tags !!python/name
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Privacidade: fatura real nunca entra no Git (ver docs/conformidade/politica-de-dados.md).
      - id: bloquear-binarios
        name: Bloquear PDF e imagens fora de docs/assets/ e dados/benchmark/sinteticas/
        entry: python scripts/bloquear_binarios.py
        language: python
        files: '(?i)\.(pdf|jpe?g|png|heic|heif|webp|bmp|tiff?|gif)$'
        exclude: '^(docs/assets/|dados/benchmark/sinteticas/)'
      - id: mypy
        name: mypy (strict, repositório inteiro)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
