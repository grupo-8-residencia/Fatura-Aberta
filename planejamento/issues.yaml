      - Em container, POST /perguntar devolve 200 com citação
      - Com `dados/` removido da imagem, o smoke do CI falha (demonstrado em uma execução de teste)
      - Nenhuma fatura real entra na imagem (`scripts/bloquear_binarios.py` continua verde)
      - PR aprovado pelo par de revisão

