[project]
name = "fa-api"
version = "0.1.0"
description = "API FastAPI do Fatura Aberta (F6)."
requires-python = ">=3.12,<3.15"
dependencies = ["fa-contratos", "fastapi>=0.115", "uvicorn>=0.30"]

[tool.uv.sources]
fa-contratos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fa_api"]
