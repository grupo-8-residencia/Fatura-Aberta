version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Pacotes internos do workspace (fa-api existe no PyPI público e quebrava a resolução do uv lock).
    ignore:
      - dependency-name: "fa-*"
