[project]
name = "fa-extracao"
version = "0.1.0"
description = "Extração documental e multimodal (F4): PDF e foto da fatura para o contrato Fatura."
requires-python = ">=3.12"
dependencies = ["fa-contratos"]

[tool.uv.sources]
fa-contratos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fa_extracao"]
