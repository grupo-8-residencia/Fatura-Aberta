name: CI

on:
  pull_request:
    # `edited` reavalia o PR quando a branch de destino muda (regra de origem da main).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, conferido contra o arquivo de checksums do release.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # Descobre quais pastas mudaram para rodar só o necessário.
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      pacotes: ${{ steps.matriz.outputs.pacotes }}
      docs: ${{ steps.filtro.outputs.docs }}
      contratos: ${{ steps.filtro.outputs.contratos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filtro
        with:
          filters: |
            comum: &comum
              - 'packages/contratos/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            rag:
              - *comum
              - 'packages/rag/**'
            motor:
              - *comum
              - 'packages/motor/**'
            extracao:
              - *comum
              - 'packages/extracao/**'
            agentes:
              - *comum
              - 'packages/agentes/**'
            api:
              - *comum
              - 'apps/api/**'
            contratos:
              - 'packages/contratos/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
      - id: matriz
        name: Monta a matriz de pacotes que mudaram
        env:
          MUDANCAS: ${{ steps.filtro.outputs.changes }}
        run: |
          pacotes=$(echo "$MUDANCAS" | jq -c '[.[] | select(. != "docs" and . != "comum" and . != "contratos")]')
          echo "pacotes=${pacotes}" >> "$GITHUB_OUTPUT"

  # Roda sempre: contratos, scripts e um teste ponta a ponta mínimo.
  nucleo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Bloqueia PDF e imagens fora das pastas permitidas (LGPD)
        run: git ls-files -z | xargs -0 uv run python scripts/bloquear_binarios.py
      - name: Testes de contratos, scripts e ponta a ponta mínimo
        run: uv run pytest packages/contratos tests

  # Cada pacote roda só os próprios testes (e todos, se contratos ou a configuração raiz mudarem).
  pacotes:
    needs: mudancas
    if: needs.mudancas.outputs.pacotes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pacote: ${{ fromJSON(needs.mudancas.outputs.pacotes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Testes do pacote ${{ matrix.pacote }}
        env:
          PACOTE: ${{ matrix.pacote }}
        run: |
          if [ "$PACOTE" = "api" ]; then pasta=apps/api; else pasta="packages/$PACOTE"; fi
          uv run pytest "$pasta"

  # Roda em todo PR e em todo push na main.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Instala o gitleaks (versão fixa, com checagem de SHA-256)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Procura segredos
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            ./gitleaks git --verbose --redact --log-opts="origin/${BASE}..HEAD"
          else
            ./gitleaks git --verbose --redact
          fi

  # Só quando docs/ (ou mkdocs.yml) mudar.
  docs:
    needs: mudancas
    if: needs.mudancas.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mkdocs build --strict

  # Gitflow: a main só recebe PR vindo da dev (release) ou de hotfix/*.
  origem-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Confere a branch de origem
        env:
          ORIGEM: ${{ github.head_ref }}
        run: |
          case "$ORIGEM" in
            dev|hotfix/*) echo "Origem permitida: $ORIGEM" ;;
            *) echo "::error::PR para a main só pode vir da dev (release) ou de hotfix/*. Abra o PR para a dev." && exit 1 ;;
          esac

  # Regra de processo: mudança em packages/contratos/ exige a label `contrato` no PR
  # (e 2 aprovações, conferidas por quem faz o merge; ver CONTRIBUTING.md).
  rotulo-contrato:
    needs: mudancas
    if: github.event_name == 'pull_request' && needs.mudancas.outputs.contratos == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Confere a label `contrato`
        env:
          ROTULOS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$ROTULOS" | jq -e 'index("contrato")' > /dev/null; then
            echo "Label contrato presente. Lembrete: este PR exige 2 aprovações."
          else
            echo "::error::Este PR altera packages/contratos/ e precisa da label 'contrato' (exige 2 aprovações)."
            exit 1
          fi

  # Resultado único para a proteção da branch: nucleo e gitleaks precisam passar; os outros não podem falhar.
  ci-verde:
    if: always()
    needs: [nucleo, pacotes, gitleaks, docs, rotulo-contrato, origem-main]
    runs-on: ubuntu-latest
    steps:
      - name: Confere os resultados
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          # nucleo e gitleaks rodam sempre e precisam ter passado (pulado não vale).
          for obrigatorio in nucleo gitleaks; do
            if [ "$(echo "$NEEDS" | jq -r ".$obrigatorio.result")" != "success" ]; then
              echo "::error::O job $obrigatorio não passou." && exit 1
            fi
          done
          # Os demais podem ser pulados, mas não podem falhar nem ser cancelados.
          if echo "$NEEDS" | jq -e 'map(select(.result == "failure" or .result == "cancelled")) | length > 0' > /dev/null; then
            echo "::error::Algum job falhou." && exit 1
          fi
