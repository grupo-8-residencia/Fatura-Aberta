  - id: S4-05
    titulo: Avaliar um embedder semântico pt-BR contra o hashing
    sprint: S4
    frente: F2
    responsaveis: [Luiz, Pedro]
    labels: [tipo:experimento, prioridade:media]
    contexto: >-
      O extrator padrão (hashing) só captura sobreposição de palavras. O protocolo `Embedder` já
      aceita um modelo multilíngue pt-BR sem mudar o resto do pacote, mas nenhum foi medido.

      Evidência parcial (fechamento dos débitos S2/S3, 23/11/2026): o `bge-m3` (Ollama local, MIT,
      1024 dimensões) foi medido no split de teste do golden set contra o hashing, em
      `avaliacao/resultados/s2s3-embedders.json`. No híbrido, recall@5 foi 0,990 contra 1,000, MRR
      0,902 contra 0,925 e latência por consulta cerca de 140 vezes maior (143 ms contra 1 ms). O
      ganho é pequeno e sem teste pareado, então o hashing segue como padrão. Falta o que o
      experimento não cobriu: teste pareado, uso de RAM e um modelo pt-BR além do `bge-m3`. A issue
      continua aberta; o trabalho vive no worktree de origin/main, sem commit.

      Reaberta pelo fechamento dos débitos S2/S3 (23/11/2026): o bge-m3 já foi comparado ao
      hashing, mas falta teste pareado, uso de RAM e um segundo modelo pt-BR para fechar a
      decisão. Responsável principal Luiz (F2); colaborador Pedro (F5, avaliação). O hashing
      segue como padrão enquanto não houver ganho reproduzível e relevante.
    tarefas:
      - Escolher um modelo multilíngue com licença compatível
      - Implementá-lo pelo protocolo `Embedder`, sem dependência no CI padrão
      - Medir com `avaliacao/metricas_recuperacao.py` e reportar custo e latência
      - Aplicar teste pareado (bootstrap ou McNemar) às diferenças de recall@5 e MRR entre hashing e o embedder semântico, com as mesmas perguntas
      - Medir o uso de RAM e a latência do embedder semântico e, se a licença permitir, comparar um segundo modelo pt-BR ou multilíngue
    criterios:
      - Comparação com o hashing em recall@k, MRR, nDCG e latência, com IC de 95%
      - O CI padrão continua offline
      - Decisão de adotar ou não documentada
      - A diferença de ranking tem intervalo de confiança pareado e a decisão de manter ou trocar o padrão está registrada com RAM, latência e tamanho do modelo
      - Nenhum peso de modelo é versionado nem baixado pelo CI

