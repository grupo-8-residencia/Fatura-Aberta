name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, conferido contra o arquivo de checksums do release.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # --------------------------------------------------
  # Qualidade Python: sempre executada em PR e push.
  # --------------------------------------------------
  qualidade-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Instala o workspace completo
        run: uv sync --all-packages --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # O pyproject.toml já configura o Mypy para packages, apps, scripts e tests.
      - name: Mypy completo
        run: uv run mypy

      - name: Valida YAML
        run: uv run pre-commit run check-yaml --all-files

      - name: Valida TOML
        run: uv run pre-commit run check-toml --all-files

      # Confere o contrato atual de configuração do ambiente.
      # Não inventa segredos que ainda não são consumidos pela API.
      - name: Valida .env.example
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path(".env.example")
          if not path.is_file():
              raise SystemExit("Arquivo .env.example inexistente.")

          values = {}
          for number, raw in enumerate(path.read_text().splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if "=" not in line:
                  raise SystemExit(
                      f"Linha {number}: formato inválido em .env.example"
                  )
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip()

              if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                  raise SystemExit(
                      f"Linha {number}: nome de variável inválido: {key}"
                  )
              if key in values:
                  raise SystemExit(
                      f"Linha {number}: variável duplicada: {key}"
                  )
              values[key] = value

          required = {"FA_API_HOST", "FA_API_PORT"}
          missing = required - values.keys()
          if missing:
              raise SystemExit(
                  f"Variáveis ausentes no .env.example: {sorted(missing)}"
              )

          if not values["FA_API_HOST"]:
              raise SystemExit("FA_API_HOST não pode ser vazio.")

          try:
              port = int(values["FA_API_PORT"])
          except ValueError as exc:
              raise SystemExit("FA_API_PORT precisa ser numérico.") from exc

          if not 1 <= port <= 65535:
              raise SystemExit("FA_API_PORT fora da faixa válida.")

          print("Contrato de .env.example válido.")
          PY

      # Barreira server-side: analisa todos os arquivos rastreados pelo Git.
      - name: Bloqueia PDF e imagens reais
        run: |
          git ls-files -z | xargs -0 -r uv run python scripts/bloquear_binarios.py

      - name: Testes completos do monorepo
        run: uv run pytest

      - name: Auditoria de vulnerabilidades Python
        run: uv run pip-audit --progress-spinner off

  # --------------------------------------------------
  # Frontend Next.js: sempre executado em PR e push.
  # --------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instala dependências determinísticas
        working-directory: apps/web
        run: npm ci

      - name: Auditoria de vulnerabilidades npm
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Build da imagem de produção
        working-directory: apps/web
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --file Dockerfile \
            --tag fatura-aberta-web:ci \
            .
          docker images fatura-aberta-web:ci

      - name: Valida execucao nao-root e resposta HTTP no container Web
        run: |
          set -euo pipefail
          docker run -d --name fa-web-ci -p 127.0.0.1:3000:3000 fatura-aberta-web:ci
          trap 'docker rm -f fa-web-ci >/dev/null 2>&1 || true' EXIT
          docker exec fa-web-ci id | grep -q "uid=1001(nextjs)"
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ | grep -q "Fatura Aberta"; then
              echo "Container fatura-aberta-web:ci respondeu HTTP 200 com conteudo esperado."
              exit 0
            fi
            sleep 1
          done
          docker logs fa-web-ci
          exit 1

  # --------------------------------------------------
  # Documentação: sempre executada em PR e push.
  # O deploy no GitHub Pages a partir da main fica em docs.yml.
  # --------------------------------------------------
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Build rigoroso da documentação
        run: uv run mkdocs build --strict

  # --------------------------------------------------
  # Build da imagem da API: sempre executado em PR e push.
  # --------------------------------------------------
  imagem-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build da imagem Docker
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --pull \
            --file infra/Dockerfile.api \
            --tag fatura-aberta-api:ci \
            .
          docker images fatura-aberta-api:ci

      - name: Valida /saude e execucao nao-root no container
        run: |
          set -euo pipefail
          docker run -d --name fa-api-ci -p 127.0.0.1:8000:8000 --env-file .env.example fatura-aberta-api:ci
          trap 'docker rm -f fa-api-ci >/dev/null 2>&1 || true' EXIT
          docker exec fa-api-ci id | grep -q "uid=10001(aplicacao)"
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/saude | jq -e '.status == "ok"' >/dev/null; then
              curl -fsS http://127.0.0.1:8000/saude
              exit 0
            fi
            sleep 1
          done
          docker logs fa-api-ci
          exit 1

  # --------------------------------------------------
  # Proteção de segredos
  # --------------------------------------------------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Instala Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Procura segredos
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "pull_request" ]; then
            ./gitleaks git \
              --verbose \
              --redact \
              --log-opts="origin/${BASE}..HEAD"
          else
            ./gitleaks git --verbose --redact
          fi

  # Exige duas aprovações reais em mudanças contratuais.
  # É um status check independente de ci-verde.
  contratos-aprovacoes:
    name: contratos-aprovacoes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Consulta o estado atual do PR e suas revisões
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "Evento push sem PR associado: verificação de aprovações de PR concluída."
            exit 0
          fi

          PULL_JSON="$(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}"
          )"

          FILES_JSON="$(
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100"
          )"

          REVIEWS_JSON="$(
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100"
          )"

          export PULL_JSON FILES_JSON REVIEWS_JSON

          python - <<'PY'
          import json
          import os
          import sys

          def flatten(value):
              if not isinstance(value, list):
                  return []
              result = []
              for item in value:
                  if isinstance(item, list):
                      result.extend(item)
                  elif isinstance(item, dict):
                      result.append(item)
              return result

          pull = json.loads(os.environ["PULL_JSON"])
          files = flatten(json.loads(os.environ["FILES_JSON"]))
          reviews = flatten(json.loads(os.environ["REVIEWS_JSON"]))

          contracts_changed = any(
              str(item.get("filename", "")).startswith("packages/contratos/")
              or str(item.get("previous_filename", "")).startswith(
                  "packages/contratos/"
              )
              for item in files
          )

          if not contracts_changed:
              print("Nenhuma alteração em packages/contratos/.")
              sys.exit(0)

          author = os.environ["PR_AUTHOR"].lower()
          head_sha = pull["head"]["sha"]

          latest_reviews = {}

          for review in reviews:
              user = review.get("user") or {}
              login = (user.get("login") or "").lower()
              submitted_at = review.get("submitted_at")

              if not login or not submitted_at:
                  continue

              if login == author:
                  continue

              if user.get("type") == "Bot" or login.endswith("[bot]"):
                  continue

              current = latest_reviews.get(login)
              if current is None or submitted_at >= current["submitted_at"]:
                  latest_reviews[login] = review

          approved = {
              login
              for login, review in latest_reviews.items()
              if review.get("state") == "APPROVED"
              and review.get("commit_id") == head_sha
              and not review.get("dismissed_at")
          }

          print(f"Aprovações válidas encontradas: {len(approved)}")

          if len(approved) < 2:
              print(
                  "::error::Alterações em packages/contratos/ exigem "
                  "duas aprovações humanas distintas no HEAD atual."
              )
              sys.exit(1)

          print("Duas aprovações válidas encontradas.")
          PY

  # --------------------------------------------------
  # Política Gitflow: main só recebe dev ou hotfix/*.
  # --------------------------------------------------
  origem-main:
    runs-on: ubuntu-latest
    steps:
      - name: Valida branch de origem
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          ORIGEM: ${{ github.head_ref }}
        run: |
          if [ "$EVENTO" != "pull_request" ] || [ "$BASE" != "main" ]; then
            echo "Política origem-main aplicável apenas a PRs destinados à main (evento=$EVENTO, base=${BASE:-N/A})."
            exit 0
          fi
          case "$ORIGEM" in
            dev|hotfix/*)
              echo "Origem permitida: $ORIGEM"
              ;;
            *)
              echo "::error::PR para main deve vir de dev ou hotfix/*."
              exit 1
              ;;
          esac

  # --------------------------------------------------
  # Resultado da CI convencional.
  # Não inclui contratos-aprovacoes porque esse check
  # precisa ser reavaliado independentemente das revisões.
  # --------------------------------------------------
  ci-verde:
    name: ci-verde
    if: always()
    needs:
      - qualidade-python
      - frontend
      - docs
      - imagem-api
      - gitleaks
      - origem-main
    runs-on: ubuntu-latest
    steps:
      - name: Confere o resultado dos jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])

          required = [
              "qualidade-python",
              "frontend",
              "docs",
              "imagem-api",
              "gitleaks",
              "origem-main",
          ]

          missing = [
              name
              for name in required
              if needs[name]["result"] != "success"
          ]

          if missing:
              print(f"Jobs obrigatórios não aprovados: {missing}")
              sys.exit(1)

          print("CI verde. Todos os jobs obrigatórios foram executados e aprovados.")
          PY
