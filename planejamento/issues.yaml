      `scripts/demonstrar_multiagentes.py` falha com `UnicodeEncodeError` no console cp1252
      sem `PYTHONUTF8=1`, e `test_trava_de_processo_morto_e_descartada` falhou no Windows com
      `OSError: [WinError 87]`, causa não investigada no relatório.

      Causa-raiz confirmada em origin/main (0bcc076): o demo imprime "→" e acentos
      (`scripts/demonstrar_multiagentes.py:161-185`) sem configurar a codificação do stdout; o
      teste (`tests/avaliacao/test_rodada_s3.py:321-325`) grava o PID 999999999 e o código
      (`avaliacao/rodada_s3.py`, sonda com `os.kill(pid, 0)`) trata só `ValueError`,
      `ProcessLookupError` e `PermissionError`; no Windows um PID inválido levanta `OSError`
      genérico. O CI roda apenas em `ubuntu-latest` e não há matriz de sistemas documentada.

      Antes de corrigir, a equipe decide o suporte oficial (Windows é ambiente de parte da
      equipe?). Se Windows não for suportado, documentar a decisão e a justificativa e manter
      o teste ativo no Linux e no macOS, sem desabilitá-lo. Esforço estimado: M. Responsável
      principal Maria Eduarda (F6, par da frente: CI e scripts); colaborador Pedro (F5, código
      da rodada e do demo).
    tarefas:
      - Registrar a decisão sobre os sistemas oficialmente suportados e documentar a matriz (docs/operacao)
      - Configurar a saída UTF-8 do demo sem exigir `PYTHONUTF8=1`, sem remover os caracteres informativos
      - Investigar e registrar a causa-raiz do `WinError 87`, tratando o `OSError` da sonda de processo de forma explícita no código e distinguindo erro ambiental de processo morto
      - Garantir que o teste de processo morto não deixe processo órfão
      - Se Windows for suportado, acrescentar um job mínimo ao CI e rodar esses testes lá; caso contrário, registrar que não é
    criterios:
      - A matriz de sistemas suportados está documentada com a justificativa
      - O demo roda em terminal cp1252 sem `PYTHONUTF8=1` e continua rodando em Linux, com teste automatizado do encoding
      - A causa-raiz do `WinError 87` está documentada e o teste de processo morto passa de forma determinística nos sistemas suportados
      - Nenhum processo órfão após a execução (verificado no teste)
      - Nenhum teste foi desabilitado ou ignorado para passar
      - Revisado por Pedro e CI verde

  - id: S6-11
    titulo: Alinhar timeouts e liberar recursos do pipeline multiagentes, com medição de latência
    sprint: S6
    frente: F6
    responsaveis: [Raissa, Pedro]
    labels: [tipo:infra, prioridade:alta]
    contexto: >-
      Origem: relatório S4 (§3.5, §3.7, §4.3, §5.7 item 5, risco R2). Latência média de
      15,04 s por chamada LLM nas perguntas e 15,69 s nas faturas, acima do timeout de 15 s da
      API; a decisão foi medir em produção e ajustar `FA_AGENTES_TIMEOUT_S`.

      Evidência em origin/main (0bcc076), `apps/api/src/fa_api/main.py:24-46` e
      `packages/agentes/src/fa_agentes/llm.py:183,201`: o timeout da API é 15 s e o do cliente
      Ollama (`FA_LLM_TIMEOUT_S`) 600 s; o trabalho roda sob `shield`, então o timeout encerra só
      a espera do chamador e a thread continua, e a vaga do semáforo (`FA_AGENTES_CONCORRENCIA`,
      padrão 2) só é devolvida quando o trabalho real termina. Duas chamadas travadas podem
      bloquear todo o tráfego de agentes por até 10 minutos, e a espera pela vaga consome o prazo
      do próprio chamador. Além disso `FA_AGENTES_*` e `FA_LLM_*` não estão no `.env.example`
      nem no `infra/docker-compose.yml`.

      Impacto: risco de indisponibilidade do pipeline sob carga e comportamento diferente
      entre ambientes. Esta issue não aumenta o timeout para esconder a latência e não define
      meta sem benchmark. As métricas p95 e a duração por etapa em /metricas ficam em S6-02.
      Esforço estimado: M. Responsável principal Raissa (F6, API e infra); colaborador Pedro
      (F5, cliente LLM e fallback T5). Depende de S5-04 para o ambiente em container.
    tarefas:
      - Medir a latência por agente e por análise (p50, p95, taxa de timeout) em hardware documentado, com e sem GPU, e publicar o relatório em `docs/avaliacao/`
      - Alinhar o timeout do cliente LLM ao da API para que o trabalho seja cancelado ou abandonado e a vaga devolvida quando a requisição expirar
      - Fazer a espera pela vaga de concorrência respeitar um limite próprio, sem consumir silenciosamente o prazo da análise
      - Expor `FA_AGENTES_TIMEOUT_S`, `FA_AGENTES_CONCORRENCIA` e `FA_LLM_TIMEOUT_S` no `.env.example`, no compose e na documentação
      - Propor as metas de latência com base no benchmark e submetê-las à aprovação da equipe
    criterios:
      - Relatório de medição reproduzível com p50, p95 e taxa de timeout, em hardware documentado
      - Os timeouts da API e do cliente LLM são coerentes e a vaga é devolvida em timeout (teste com LLM simulado lento)
      - O fallback determinístico T5 continua funcionando em timeout (teste)
      - As variáveis estão documentadas nos três lugares citados
      - As metas de latência foram aprovadas pela equipe e registradas, sem SLO inventado
      - Revisado por Pedro e CI verde

  - id: S6-12
    titulo: Corrigir o tratamento de exceções dos agentes em /analisar e /perguntar
    sprint: S6
    frente: F6
    responsaveis: [Maria Eduarda, Pedro]
    labels: [tipo:bug, prioridade:media]
    contexto: >-
      Origem: inspeção do estado atual a partir do relatório S4 (§2.6, §4.4).

      Evidência em origin/main (0bcc076), `apps/api/src/fa_api/main.py`: em `/analisar`
      (`:162-164`) qualquer `Exception` dos agentes é engolida e só a classe do erro vai para o
      log, sem traceback, e o usuário vê apenas um `aviso`; em `/perguntar` (`:182-193`) só
      `TimeoutError` é tratado, e qualquer outra exceção vira HTTP 500 sem tratamento.
      Comportamento inconsistente entre os dois endpoints e falhas difíceis de depurar.

      Esforço estimado: P. Responsável principal Maria Eduarda (F6, par da frente: `apps/api`); colaborador Pedro (F5,
      agentes).
      Não altera o contrato público além de padronizar o erro.
    tarefas:
      - Padronizar o tratamento de falha dos agentes nos dois endpoints, devolvendo erro ou abstenção explícitos e nunca 500 sem corpo
      - Registrar em log o traceback e o request-id (se disponível) sem texto de fatura nem dado pessoal
      - Cobrir com teste as falhas por exceção, timeout e agentes indisponíveis nos dois endpoints
    criterios:
      - Uma exceção qualquer nos agentes não produz HTTP 500 em /perguntar nem erro silencioso em /analisar (testes)
      - O log registra tipo e traceback da falha, sem PII (teste com caplog)
      - A resposta ao usuário distingue falha dos agentes de ausência de achados
      - Revisado por Pedro e CI verde

