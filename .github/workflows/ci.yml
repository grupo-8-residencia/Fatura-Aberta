name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, conferido contra o arquivo de checksums do release.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # ==================================================================
  # ESTÁGIO 1A — MATRIX: BACKEND (Python / FastAPI / Motor / Extração)
  # ==================================================================
  Backend:
    name: Backend (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint
          - typecheck
          - unit
          - integration
          - security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Instala o workspace Python
        run: uv sync --all-packages --locked

      - name: Ruff lint, format e sintaxe YAML/TOML
        if: matrix.check == 'lint'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pre-commit run check-yaml --all-files
          uv run pre-commit run check-toml --all-files
          {
            echo "### Backend (lint) summary"
            echo "- **Ruff lint & format:** aprovado"
            echo "- **YAML & TOML syntax:** aprovado"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checagem estrita de tipos (Mypy)
        if: matrix.check == 'typecheck'
        run: |
          uv run mypy
          {
            echo "### Backend (typecheck) summary"
            echo "- **Mypy (strict mode):** 100% dos pacotes, apps, scripts e testes tipados sem erros"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Testes unitários dos pacotes e da API
        if: matrix.check == 'unit'
        run: |
          uv run pytest packages/ apps/ -v --junitxml=junit-unit.xml
          {
            echo "### Backend (unit) summary"
            echo "- **Escopo:** \`packages/contratos\`, \`packages/extracao\`, \`packages/motor\`, \`packages/rag\`, \`packages/agentes\`, \`apps/api\`"
            echo "- **Resultado:** suíte unitária aprovada"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Testes de integração, E2E e scripts de governança
        if: matrix.check == 'integration'
        run: |
          uv run pytest tests/ -v --junitxml=junit-integration.xml
          {
            echo "### Backend (integration) summary"
            echo "- **Escopo:** \`tests/e2e\` e \`tests/scripts\` (governança, contratos, binários, backlog)"
            echo "- **Resultado:** suíte de integração aprovada"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auditoria de vulnerabilidades SCA (pip-audit)
        if: matrix.check == 'security'
        run: |
          uv run pip-audit --progress-spinner off
          {
            echo "### Backend (security) summary"
            echo "- **Ferramenta:** \`pip-audit\` sobre \`uv.lock\`"
            echo "- **Vulnerabilidades conhecidas:** 0"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==================================================================
  # ESTÁGIO 1B — MATRIX: FRONTEND (Next.js 16 / React 19 / TypeScript)
  # ==================================================================
  Frontend:
    name: Frontend (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint
          - typecheck
          - security
          - build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instala dependências determinísticas
        working-directory: apps/web
        run: npm ci

      - name: ESLint 9 (flat config)
        if: matrix.check == 'lint'
        working-directory: apps/web
        run: |
          npm run lint
          {
            echo "### Frontend (lint) summary"
            echo "- **ESLint 9 (flat config):** aprovado sem alertas"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: TypeScript strict typecheck
        if: matrix.check == 'typecheck'
        working-directory: apps/web
        run: |
          npm run typecheck
          {
            echo "### Frontend (typecheck) summary"
            echo "- **Next.js Typegen & TypeScript (\`strict: true\`):** aprovado"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auditoria SCA npm
        if: matrix.check == 'security'
        working-directory: apps/web
        run: |
          npm audit --audit-level=high
          {
            echo "### Frontend (security) summary"
            echo "- **npm audit (\`--audit-level=high\`):** 0 vulnerabilidades"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build de produção Next.js (standalone)
        if: matrix.check == 'build'
        working-directory: apps/web
        run: |
          npm run build
          {
            echo "### Frontend (build) summary"
            echo "- **Next.js standalone build:** aprovado"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==================================================================
  # ESTÁGIO 1C — MATRIX: MLOPS (Contratos, Proveniência, LGPD e Aval.)
  # ==================================================================
  MLOps:
    name: MLOps (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - contracts-schema
          - data-provenance
          - privacy-lgpd
          - eval-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Instala o workspace para validação MLOps
        run: uv sync --all-packages --locked

      - name: Valida JSON Schemas congelados (fa-contratos v1)
        if: matrix.check == 'contracts-schema'
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import fa_contratos
          from fa_contratos import Achado, Citacao, Fatura, ItemFatura

          assert fa_contratos.__version__ == "1.0.0", f"Versão inesperada: {fa_contratos.__version__}"
          rows = []
          for model in (Fatura, ItemFatura, Achado, Citacao):
              schema = model.model_json_schema()
              assert schema.get("additionalProperties") is False, f"{model.__name__} deve ter extra='forbid'"
              raw = json.dumps(schema, sort_keys=True)
              digest = hashlib.sha256(raw.encode("utf-8")).hexdigest()[:12]
              rows.append((model.__name__, len(schema.get("properties", {})), digest))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              lines = [
                  "### MLOps (contracts-schema) summary",
                  f"- **Pacote:** `fa-contratos v{fa_contratos.__version__}` (congelado)",
                  "",
                  "| Modelo | Campos | SHA-256 Schema (12 chars) |",
                  "|---|---:|---|",
              ]
              for name, count, digest in rows:
                  lines.append(f"| `{name}` | {count} | `{digest}` |")
              Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Verifica proveniência e SHA-256 da base tarifária ANEEL
        if: matrix.check == 'data-provenance'
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          prov_path = Path("dados/tarifas/proveniencia.json")
          assert prov_path.is_file(), "proveniencia.json ausente em dados/tarifas/"
          meta = json.loads(prov_path.read_text(encoding="utf-8"))
          for key in ("fonte", "url", "data_download", "arquivo", "sha256"):
              assert meta.get(key), f"Campo obrigatório ausente em proveniencia.json: {key}"

          artifact = prov_path.parent / meta["arquivo"]
          assert artifact.is_file(), f"Artefato tarifário não encontrado: {artifact}"
          actual_sha = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert actual_sha == meta["sha256"], (
              f"Divergência de SHA-256 em {artifact}: esperado {meta['sha256']}, calculado {actual_sha}"
          )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text(
                  "### MLOps (data-provenance) summary\n"
                  f"- **Artefato:** `{meta['arquivo']}`\n"
                  f"- **Data de obtenção:** `{meta['data_download']}`\n"
                  f"- **SHA-256 verificado:** `{actual_sha}`\n",
                  encoding="utf-8",
              )
          PY

      - name: Barreira de privacidade LGPD e anonimização PII
        if: matrix.check == 'privacy-lgpd'
        run: |
          git ls-files -z | xargs -0 -r uv run python scripts/bloquear_binarios.py
          uv run pytest packages/extracao/tests/test_anonimizacao.py tests/scripts/test_bloquear_binarios.py -v
          {
            echo "### MLOps (privacy-lgpd) summary"
            echo "- **Barreira de binários/faturas reais (\`bloquear_binarios.py\`):** 100% dos arquivos rastreados verificados"
            echo "- **Testes de anonimização PII (\`fa_extracao.anonimizar\`):** aprovados"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Valida protocolo experimental B1-B5 e pacote de definição
        if: matrix.check == 'eval-protocol'
        run: |
          uv run python scripts/pacote_definicao.py
          uv run pytest tests/scripts/test_pacote_definicao.py -v
          uv run python - <<'PY'
          from pathlib import Path

          protocolo = Path("docs/avaliacao/index.md").read_text(encoding="utf-8")
          metricas = Path("docs/avaliacao/metricas.md").read_text(encoding="utf-8")
          for baseline in ("B1", "B2", "B3", "B4", "B5"):
              assert baseline in protocolo, f"Baseline {baseline} ausente em docs/avaliacao/index.md"
          for termo in ("seed = 42", "10.000", "McNemar", "0,75"):
              assert termo in protocolo or termo in metricas, f"Parâmetro MLOps {termo} ausente em docs/avaliacao/"
          PY
          {
            echo "### MLOps (eval-protocol) summary"
            echo "- **Baselines verificados:** B1, B2, B3, B4 e B5"
            echo "- **Rigor estatístico:** Bootstrap pareado (B=10.000, seed=42), McNemar e Kappa de Cohen (>= 0,75)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==================================================================
  # ESTÁGIO 1D — MATRIX: INFRA (Ambiente, Segredos, Containers e Docs)
  # ==================================================================
  Infra:
    name: Infra (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - validate
          - gitleaks
          - docker-api
          - docker-web
          - docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configura uv (para validate e docs)
        if: matrix.check == 'validate' || matrix.check == 'docs'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Valida contrato .env.example
        if: matrix.check == 'validate'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(".env.example")
          if not path.is_file():
              raise SystemExit("Arquivo .env.example inexistente.")

          values = {}
          for number, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if "=" not in line:
                  raise SystemExit(f"Linha {number}: formato inválido em .env.example")
              key, value = line.split("=", 1)
              key, value = key.strip(), value.strip()
              if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                  raise SystemExit(f"Linha {number}: nome de variável inválido: {key}")
              if key in values:
                  raise SystemExit(f"Linha {number}: variável duplicada: {key}")
              values[key] = value

          required = {"FA_API_HOST", "FA_API_PORT"}
          missing = required - values.keys()
          if missing:
              raise SystemExit(f"Variáveis ausentes no .env.example: {sorted(missing)}")
          port = int(values["FA_API_PORT"])
          if not 1 <= port <= 65535:
              raise SystemExit("FA_API_PORT fora da faixa válida.")
          print("Contrato de .env.example válido.")
          PY

      - name: Varredura de segredos (Gitleaks SHA-256 fixado)
        if: matrix.check == 'gitleaks'
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          curl -sSfL \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          if [ "$EVENTO" = "pull_request" ]; then
            ./gitleaks git --verbose --redact --log-opts="origin/${BASE}..HEAD"
          else
            ./gitleaks git --verbose --redact
          fi

      - name: Build multi-stage do container da API
        if: matrix.check == 'docker-api'
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --pull \
            --file infra/Dockerfile.api \
            --tag fatura-aberta-api:ci \
            .
          docker images fatura-aberta-api:ci

      - name: Build multi-stage do container Web
        if: matrix.check == 'docker-web'
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --file apps/web/Dockerfile \
            --tag fatura-aberta-web:ci \
            apps/web
          docker images fatura-aberta-web:ci

      - name: Build estrito da documentação (MkDocs)
        if: matrix.check == 'docs'
        run: |
          uv sync --locked
          uv run mkdocs build --strict

  # ==================================================================
  # ESTÁGIO 2 — GATES DE APROVAÇÃO POR DOMÍNIO
  # ==================================================================
  backend-approved:
    name: Backend Approved
    needs: [Backend]
    runs-on: ubuntu-latest
    steps:
      - name: Certifica aprovação da matriz Backend
        run: echo "Matriz Backend aprovada com sucesso."

  frontend-approved:
    name: Frontend Approved
    needs: [Frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Certifica aprovação da matriz Frontend
        run: echo "Matriz Frontend aprovada com sucesso."

  mlops-approved:
    name: MLOps Approved
    needs: [MLOps]
    runs-on: ubuntu-latest
    steps:
      - name: Certifica aprovação da matriz MLOps
        run: echo "Matriz MLOps aprovada com sucesso."

  infra-approved:
    name: Infra Approved
    needs: [Infra]
    runs-on: ubuntu-latest
    steps:
      - name: Certifica aprovação da matriz Infra
        run: echo "Matriz Infra aprovada com sucesso."

  # ==================================================================
  # ESTÁGIO 3 — MATRIX: RUNTIME & SMOKE (Containers, Segurança e E2E)
  # ==================================================================
  Runtime:
    name: Runtime (${{ matrix.suite }})
    needs:
      - backend-approved
      - frontend-approved
      - mlops-approved
      - infra-approved
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - api-container-smoke
          - web-container-smoke
          - pipeline-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configura uv (para pipeline-e2e)
        if: matrix.suite == 'pipeline-e2e'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Smoke test e validação non-root do container API
        if: matrix.suite == 'api-container-smoke'
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --file infra/Dockerfile.api --tag fatura-aberta-api:ci .
          docker run -d --name fa-api-ci -p 127.0.0.1:8000:8000 --env-file .env.example fatura-aberta-api:ci
          trap 'docker rm -f fa-api-ci >/dev/null 2>&1 || true' EXIT
          docker exec fa-api-ci id | grep -q "uid=10001(aplicacao)"
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/saude | jq -e '.status == "ok"' >/dev/null; then
              curl -fsS http://127.0.0.1:8000/saude
              exit 0
            fi
            sleep 1
          done
          docker logs fa-api-ci
          exit 1

      - name: Smoke test e validação non-root do container Web
        if: matrix.suite == 'web-container-smoke'
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --file apps/web/Dockerfile --tag fatura-aberta-web:ci apps/web
          docker run -d --name fa-web-ci -p 127.0.0.1:3000:3000 fatura-aberta-web:ci
          trap 'docker rm -f fa-web-ci >/dev/null 2>&1 || true' EXIT
          docker exec fa-web-ci id | grep -q "uid=1001(nextjs)"
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ | grep -q "Fatura Aberta"; then
              echo "Container fatura-aberta-web:ci respondeu HTTP 200 com conteudo esperado."
              exit 0
            fi
            sleep 1
          done
          docker logs fa-web-ci
          exit 1

      - name: Pipeline E2E (Extração PDF sintético -> Contrato Fatura -> API)
        if: matrix.suite == 'pipeline-e2e'
        run: |
          uv sync --all-packages --locked
          uv run pytest packages/extracao/tests/test_parser.py apps/api/tests/test_api.py tests/e2e/test_fluxo_minimo.py -v

  # ==================================================================
  # GOVERNANÇA DE BRANCH E DE CONTRATOS (Requeridos pelos Rulesets)
  # ==================================================================
  contratos-aprovacoes:
    name: contratos-aprovacoes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Consulta o estado atual do PR e suas revisões
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "Evento push sem PR associado: verificação de aprovações de PR concluída."
            exit 0
          fi

          PULL_JSON="$(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}"
          )"

          FILES_JSON="$(
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100"
          )"

          REVIEWS_JSON="$(
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100"
          )"

          export PULL_JSON FILES_JSON REVIEWS_JSON

          python - <<'PY'
          import json
          import os
          import sys

          def flatten(value):
              if not isinstance(value, list):
                  return []
              result = []
              for item in value:
                  if isinstance(item, list):
                      result.extend(item)
                  elif isinstance(item, dict):
                      result.append(item)
              return result

          pull = json.loads(os.environ["PULL_JSON"])
          files = flatten(json.loads(os.environ["FILES_JSON"]))
          reviews = flatten(json.loads(os.environ["REVIEWS_JSON"]))

          contracts_changed = any(
              str(item.get("filename", "")).startswith("packages/contratos/")
              or str(item.get("previous_filename", "")).startswith(
                  "packages/contratos/"
              )
              for item in files
          )

          if not contracts_changed:
              print("Nenhuma alteração em packages/contratos/.")
              sys.exit(0)

          author = os.environ["PR_AUTHOR"].lower()
          head_sha = pull["head"]["sha"]

          latest_reviews = {}

          for review in reviews:
              user = review.get("user") or {}
              login = (user.get("login") or "").lower()
              submitted_at = review.get("submitted_at")

              if not login or not submitted_at:
                  continue

              if login == author:
                  continue

              if user.get("type") == "Bot" or login.endswith("[bot]"):
                  continue

              current = latest_reviews.get(login)
              if current is None or submitted_at >= current["submitted_at"]:
                  latest_reviews[login] = review

          approved = {
              login
              for login, review in latest_reviews.items()
              if review.get("state") == "APPROVED"
              and review.get("commit_id") == head_sha
              and not review.get("dismissed_at")
          }

          print(f"Aprovações válidas encontradas: {len(approved)}")

          if len(approved) < 2:
              print(
                  "::error::Alterações em packages/contratos/ exigem "
                  "duas aprovações humanas distintas no HEAD atual."
              )
              sys.exit(1)

          print("Duas aprovações válidas encontradas.")
          PY

  origem-main:
    runs-on: ubuntu-latest
    steps:
      - name: Valida branch de origem
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          ORIGEM: ${{ github.head_ref }}
        run: |
          if [ "$EVENTO" != "pull_request" ] || [ "$BASE" != "main" ]; then
            echo "Política origem-main aplicável apenas a PRs destinados à main (evento=$EVENTO, base=${BASE:-N/A})."
            exit 0
          fi
          case "$ORIGEM" in
            dev|hotfix/*)
              echo "Origem permitida: $ORIGEM"
              ;;
            *)
              echo "::error::PR para main deve vir de dev ou hotfix/*."
              exit 1
              ;;
          esac

  # ==================================================================
  # ESTÁGIO 4 — GATE FINAL CONSOLIDADO (ci-verde)
  # ==================================================================
  ci-verde:
    name: ci-verde
    if: always()
    needs:
      - backend-approved
      - frontend-approved
      - mlops-approved
      - infra-approved
      - Runtime
      - origem-main
    runs-on: ubuntu-latest
    steps:
      - name: Confere o resultado de todos os estágios da DAG
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          needs = json.loads(os.environ["NEEDS"])

          required = [
              "backend-approved",
              "frontend-approved",
              "mlops-approved",
              "infra-approved",
              "Runtime",
              "origem-main",
          ]

          missing = [
              name
              for name in required
              if needs[name]["result"] != "success"
          ]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              lines = [
                  "### Gate Consolidado (`ci-verde`)",
                  "",
                  "| Estágio / Domínio | Resultado |",
                  "|---|---|",
              ]
              for name in required:
                  res = needs[name]["result"]
                  lines.append(f"| `{name}` | `{res}` |")
              Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          if missing:
              print(f"Estágios obrigatórios não aprovados: {missing}")
              sys.exit(1)

          print("CI verde. Todas as matrizes (Backend, Frontend, MLOps, Infra e Runtime) aprovadas.")
          PY
