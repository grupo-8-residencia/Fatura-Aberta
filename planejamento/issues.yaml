      - Acrescentar ao smoke do job Runtime uma chamada a /analisar com consumo divergente e outra a /perguntar, falhando se o aviso indicar agentes indisponíveis
      - Rodar `docker build` e o smoke localmente e conferir a lista de arquivos da imagem
      - Atualizar `docs/operacao/deploy-observabilidade-carga.md` se a lista de arquivos da imagem mudar
      - Copiar também `packages/extracao` para o runtime e incluir no smoke um upload de PDF sintético (coordenar com S6-06; necessário se a demo rodar em containers)
    criterios:
