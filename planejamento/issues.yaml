  - id: S3-02
    titulo: Rodar B2 e B3 e calibrar o juiz LLM contra 40 itens humanos
    sprint: S3
    frente: F5
    labels: [tipo:experimento, prioridade:alta, gate]
    contexto: >-
      Gate da S3: resultados com intervalo de confiança. Resultado negativo também vale e deve
      ser reportado.

      Atualizada pela auditoria de 23/11/2026 (origin/main 0bcc076) (EV-014; REQ-MET-04). A
      calibração mediu κ = 0,03 em 39 itens, abaixo do limiar de 0,75; o juiz não é usado nas
      métricas finais. Falta registrar o pivot previsto no protocolo. Esforço estimado: P.

      Fechamento dos débitos S2/S3 (23/11/2026): κ = 0,029 confirmado (0,164 após a recalibração e
      −0,136 na metade retida). Nenhum artefato do repositório registra κ = 0,79 ou 0,84. Os dois
      anotadores concordam em 40 de 40 itens e `juiz-40.csv` não guarda os vereditos do juiz, então
      o κ humano × juiz só se reproduz rodando o juiz de novo. O juiz permanece fora da avaliação.

      Reaberta pelo fechamento dos débitos S2/S3 (23/11/2026): falta versionar os vereditos do
      juiz por item e registrar a decisão sobre o juiz, pois hoje o κ humano × juiz não se
      reproduz sem rodar o juiz de novo. O juiz continua fora da avaliação de qualidade.
    tarefas:
      - Rodar B2 (LLM com RAG sem filtros de vigência)
      - Rodar B3 (LLM com RAG e filtros de vigência)
      - Anotar 40 itens humanos e calibrar o juiz LLM
      - "Registrar a decisão do pivot: refinar a rubrica do juiz ou usar anotação humana direta"
      - Versionar em `juiz-40.csv` ou em artefato ao lado os vereditos do juiz por item, com prompt, modelo e digest
      - Registrar a decisão: refinar a rubrica do juiz com uma proposta de calibração metodologicamente adequada ou manter só a anotação humana como referência
    criterios:
      - Resultados de B2 e B3 com intervalo de confiança
      - Concordância juiz × humano medida em 40 itens com limiar κ ≥ 0,75, conforme `docs/avaliacao/metricas.md`
      - Código e configuração das rodadas versionados
      - Decisão do pivot do juiz registrada em `docs/avaliacao/`
      - O κ humano × juiz é recalculado por teste automatizado a partir de arquivos versionados
      - A decisão sobre o juiz está registrada em `docs/avaliacao/` e o juiz só volta a ser usado com κ ≥ 0,75 em dados não usados para ajustar o prompt

  - id: S3-03
    titulo: Implementar as checagens de nível B com a tabela ANEEL versionada
    sprint: S5
    frente: F3
    labels: [tipo:feature, prioridade:alta]
    contexto: >-
      O nível B compara TUSD+TE e bandeira com a tabela oficial versionada na S1. A saída sempre
      diz que "diverge da tabela oficial que conseguimos obter", com fonte e data.

      Reaberta pela auditoria de 23/11/2026 (origin/main 0bcc076) (EV-002, EV-009, EV-035;
      RF-09/10/11). As checagens existem e passam nos testes de unidade, mas os valores de
      bandeira (REH ANEEL nº 3.316/2024) seguem como parâmetro do projeto "A verificar" e a
      seleção da tarifa usa só o mês de referência, sem regra para o mês do reajuste (a tarifa
      muda em 22/10/2026). A conexão ao /analisar é entregue em S6-05, que depende desta issue.
      Decisão externa pendente: validação especializada dos valores de bandeira e da regra para
      fatura cujo ciclo atravessa a data de reajuste (a equipe técnica não valida regra
      regulatória). Esforço estimado: P.
    tarefas:
      - Checar TUSD+TE contra a tabela versionada
      - Checar a bandeira tarifária
      - Incluir fonte e data da tabela em todo achado de nível B
      - Registrar em `dados/tarifas/README.md` e `dados/normas/README.md` o ato oficial, a vigência e a data de conferência de cada valor de bandeira
      - Obter a validação especializada dos valores de bandeira e da regra para o mês de reajuste
      - Cobrir com teste o mês 10/2026 (reajuste em 22/10) conforme a regra validada
    criterios:
      - Todo achado de nível B traz fonte e data da tabela
      - Testes unitários passando no CI
      - Nenhuma mensagem usa "ilegal" ou estima restituição
      - Cada valor de bandeira tem ato oficial, vigência e data de conferência registrados, com a validação do especialista referenciada
      - Fatura de 10/2026 produz abstenção ou o resultado definido pela regra validada, com teste automatizado

