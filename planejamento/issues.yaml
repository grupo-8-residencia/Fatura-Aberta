  - id: S5-04
    titulo: Incluir `dados/` na imagem da API e cobrir /analisar com agentes no smoke do CI
    sprint: S5
    frente: F6
    responsaveis: [Raissa]
    labels: [tipo:infra, prioridade:alta]
    contexto: >-
      O Dockerfile da API copia só `packages/` e `apps/api/` e o `.dockerignore` exclui `dados`,
      mas o RAG carrega `dados/normas/corpus_b1.json` por caminho relativo à raiz do repositório
      e o nível B lerá `dados/tarifas`. Numa simulação do layout da imagem, /analisar perde as
      explicações (aviso "agentes indisponíveis") e /perguntar levanta FileNotFoundError; o
      smoke do CI só consulta /saude. Evidência: EV-004 (`infra/Dockerfile.api:L45-L46`,
      `.dockerignore:L17`, `packages/rag/src/fa_rag/corpus.py:L16-L18`). Requisitos: RF-12,
      RF-13, RNF-07. Prioridade alta (P1): critério de aceite sem demonstração no modo Docker.

      Dependências: nenhuma. Destrava S6-05, S6-06, S6-03 e S6-02. Fora de escopo: deploy
      público e readiness (S6-02) e persistência. Esforço estimado: P (até 1 dia).
    tarefas:
