[project]
name = "fa-contratos"
version = "0.1.0"
description = "Contratos de dados compartilhados (Pydantic v2): Fatura, ItemFatura, Achado e Citacao."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fa_contratos"]
