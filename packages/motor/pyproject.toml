[project]
name = "fa-motor"
version = "0.1.0"
description = "Motor de regras e evidências (F3): checagens determinísticas de nível A e de nível B."
requires-python = ">=3.12,<3.15"
dependencies = ["fa-contratos"]

[tool.uv.sources]
fa-contratos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fa_motor"]
