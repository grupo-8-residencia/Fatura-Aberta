name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, conferido contra o arquivo de checksums do release.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # Descobre quais pastas mudaram para rodar só o necessário.
  mudancas:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    outputs:
      pacotes: ${{ steps.matriz.outputs.pacotes }}
      docs: ${{ steps.filtro.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filtro
        with:
          filters: |
            comum: &comum
              - 'packages/contratos/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            rag:
              - *comum
              - 'packages/rag/**'
            motor:
              - *comum
              - 'packages/motor/**'
            extracao:
              - *comum
              - 'packages/extracao/**'
            agentes:
              - *comum
              - 'packages/agentes/**'
            api:
              - *comum
              - 'apps/api/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
      - id: matriz
        name: Monta a matriz de pacotes que mudaram
        env:
          MUDANCAS: ${{ steps.filtro.outputs.changes }}
        run: |
          pacotes=$(echo "$MUDANCAS" | jq -c '[.[] | select(. != "docs" and . != "comum")]')
          echo "pacotes=${pacotes}" >> "$GITHUB_OUTPUT"

  # Roda sempre: contratos, scripts e um teste ponta a ponta mínimo.
  nucleo:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Bloqueia PDF e imagens fora das pastas permitidas (LGPD)
        run: git ls-files -z | xargs -0 uv run python scripts/bloquear_binarios.py
      - name: Testes de contratos, scripts e ponta a ponta mínimo
        run: uv run pytest packages/contratos tests

  # Cada pacote roda só os próprios testes (e todos, se contratos ou a configuração raiz mudarem).
  pacotes:
    needs: mudancas
    if: github.event_name != 'pull_request_review' && needs.mudancas.outputs.pacotes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pacote: ${{ fromJSON(needs.mudancas.outputs.pacotes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Testes do pacote ${{ matrix.pacote }}
        env:
          PACOTE: ${{ matrix.pacote }}
        run: |
          if [ "$PACOTE" = "api" ]; then pasta=apps/api; else pasta="packages/$PACOTE"; fi
          uv run pytest "$pasta"

  # Roda em todo PR e em todo push na main.
  gitleaks:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Instala o gitleaks (versão fixa, com checagem de SHA-256)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Procura segredos
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            ./gitleaks git --verbose --redact --log-opts="origin/${BASE}..HEAD"
          else
            ./gitleaks git --verbose --redact
          fi

  # Só quando docs/ (ou mkdocs.yml) mudar.
  docs:
    needs: mudancas
    if: github.event_name != 'pull_request_review' && needs.mudancas.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mkdocs build --strict

  # Exige duas aprovações reais em mudanças contratuais.
  # É um status check independente de ci-verde.
  contratos-aprovacoes:
    name: contratos-aprovacoes
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Consulta o estado atual do PR e suas revisões
        shell: bash
        run: |
          set -euo pipefail

          PULL_JSON="$(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}"
          )"

          FILES_JSON="$(
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100"
          )"

          REVIEWS_JSON="$(
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100"
          )"

          export PULL_JSON FILES_JSON REVIEWS_JSON

          python - <<'PY'
          import json
          import os
          import sys

          def flatten(value):
              if not isinstance(value, list):
                  return []
              result = []
              for item in value:
                  if isinstance(item, list):
                      result.extend(item)
                  elif isinstance(item, dict):
                      result.append(item)
              return result

          pull = json.loads(os.environ["PULL_JSON"])
          files = flatten(json.loads(os.environ["FILES_JSON"]))
          reviews = flatten(json.loads(os.environ["REVIEWS_JSON"]))

          contracts_changed = any(
              str(item.get("filename", "")).startswith("packages/contratos/")
              or str(item.get("previous_filename", "")).startswith(
                  "packages/contratos/"
              )
              for item in files
          )

          if not contracts_changed:
              print("Nenhuma alteração em packages/contratos/.")
              sys.exit(0)

          author = os.environ["PR_AUTHOR"].lower()
          head_sha = pull["head"]["sha"]

          latest_reviews = {}

          for review in reviews:
              user = review.get("user") or {}
              login = (user.get("login") or "").lower()
              submitted_at = review.get("submitted_at")

              if not login or not submitted_at:
                  continue

              if login == author:
                  continue

              if user.get("type") == "Bot" or login.endswith("[bot]"):
                  continue

              current = latest_reviews.get(login)
              if current is None or submitted_at >= current["submitted_at"]:
                  latest_reviews[login] = review

          approved = {
              login
              for login, review in latest_reviews.items()
              if review.get("state") == "APPROVED"
              and review.get("commit_id") == head_sha
              and not review.get("dismissed_at")
          }

          print(f"Aprovações válidas encontradas: {len(approved)}")

          if len(approved) < 2:
              print(
                  "::error::Alterações em packages/contratos/ exigem "
                  "duas aprovações humanas distintas no HEAD atual."
              )
              sys.exit(1)

          print("Duas aprovações válidas encontradas.")
          PY

  # Gitflow: a main só recebe PR vindo da dev (release) ou de hotfix/*.
  origem-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Confere a branch de origem
        env:
          ORIGEM: ${{ github.head_ref }}
        run: |
          case "$ORIGEM" in
            dev|hotfix/*) echo "Origem permitida: $ORIGEM" ;;
            *) echo "::error::PR para a main só pode vir da dev (release) ou de hotfix/*. Abra o PR para a dev." && exit 1 ;;
          esac

  # Resultado da CI convencional.
  # Não inclui contratos-aprovacoes porque esse check
  # precisa ser reavaliado independentemente das revisões.
  ci-verde:
    name: ci-verde
    if: always() && github.event_name != 'pull_request_review'
    needs: [nucleo, pacotes, gitleaks, docs, origem-main]
    runs-on: ubuntu-latest
    steps:
      - name: Confere os resultados
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          # nucleo e gitleaks rodam sempre e precisam ter passado (pulado não vale).
          for obrigatorio in nucleo gitleaks; do
            if [ "$(echo "$NEEDS" | jq -r ".$obrigatorio.result")" != "success" ]; then
              echo "::error::O job $obrigatorio não passou." && exit 1
            fi
          done
          # Os demais podem ser pulados, mas não podem falhar nem ser cancelados.
          if echo "$NEEDS" | jq -e 'map(select(.result == "failure" or .result == "cancelled")) | length > 0' > /dev/null; then
            echo "::error::Algum job falhou." && exit 1
          fi
