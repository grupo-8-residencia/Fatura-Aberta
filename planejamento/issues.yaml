  - id: S7-07
    titulo: Avaliar de forma independente a fundamentação das respostas da política T5
    sprint: S7
    frente: F5
    responsaveis: [Pedro, Raissa]
    labels: [tipo:experimento, prioridade:media]
    contexto: >-
      Origem: relatório S4 (§3.5, §4.1, risco R1). A taxa de 0% de afirmações sem suporte da
      política T5 é nula por construção: o Auditor determinístico filtra as respostas e as
      mesmas regras medem a taxa, e trechos literais são contados como suportados
      (`avaliacao/rodada_s4.py:229,248`). Isso mostra que a regra foi aplicada, não que as
      explicações estejam factualmente corretas.

      Estado atual: o juiz LLM ficou desligado por concordância insuficiente (κ 0,029, depois
      0,164 na metade reservada; `docs/avaliacao/resultados.md:230`) e S3-02 trata só da sua
      calibração. Não reativar o juiz LLM nem usar o Auditor como único juiz de si mesmo.
      O parecer jurídico da citação literal (risco R5) é pendência externa do docente de
      Direito e não faz parte desta issue.

      Esforço estimado: M. Responsável principal Pedro (F5); colaboradora Raissa (F5, par).
      Depende da rodada final de S7-02 para as respostas a avaliar.
    tarefas:
      - Definir a rubrica de fundamentação factual, relevância da citação e correção da explicação
      - Selecionar a amostra de respostas por sorteio registrado, incluindo respostas que o Auditor rejeitaria, sem o viés de filtragem dele
      - Anotar a amostra de forma independente por duas pessoas, cegas ao veredito do Auditor
      - Calcular a concordância entre anotadores e a métrica independente da regra determinística
      - Publicar os resultados com as limitações em `docs/avaliacao/`
    criterios:
      - Rubrica versionada e amostra sorteada com semente registrada
      - Anotação independente por duas pessoas e concordância (κ) documentada
      - A métrica final independe das regras do Auditor e é reproduzível a partir dos arquivos versionados
      - Limitações e ameaças à validade registradas; o juiz LLM permanece desligado
      - Revisado pela Raissa
