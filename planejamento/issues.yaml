  - id: S6-09
    titulo: Fixar a política de fim de linha e tornar o checksum do golden set reproduzível entre sistemas
    sprint: S6
    frente: F5
    responsaveis: [Pedro, Luiz]
    labels: [tipo:infra, prioridade:media]
    contexto: >-
      Origem: relatório S4 (§5.2 F1 a F4, §5.7 item 1, risco R3). Com `core.autocrlf=true` o
      índice guarda LF e o disco CRLF; o SHA-256 de `dados/golden-set/perguntas.jsonl` diverge
      de `checksums.sha256` e 4 testes falham.

      Causa-raiz confirmada em origin/main (0bcc076): não existe `.gitattributes` e
      `scripts/gerar_golden_set.py:194` faz o hash dos bytes brutos de cada arquivo
      (`read_bytes`); os testes de `tests/scripts/test_gerar_golden_set.py` e
      `test_kit_anotacao.py` dependem desses bytes. O problema não reproduz em macOS ou Linux
      com checkout padrão, mas reaparece em qualquer clone com conversão de fim de linha.

      Impacto: o golden set é o gabarito de todas as rodadas; checksum que depende da
      configuração do Git de cada pessoa compromete a reprodutibilidade dos resultados.
      Fora de escopo: alterar o conteúdo do golden set ou regerar seus checksums.
      Esforço estimado: M. Responsável principal Pedro (F5, dono do golden set); colaborador
      Luiz (F4 e dono do corpus em `dados/`, política de dados versionados). Depende de nada; o job de CI novo usa a
      matriz de S6-10 se ela existir.
    tarefas:
      - Declarar em `.gitattributes` a política de fim de linha (LF) para `dados/golden-set/` e para os demais arquivos de dados verificados por checksum
      - Confirmar com `git ls-files --eol` e uma renormalização de teste (sem commitar) que o conteúdo do golden set não muda
      - Fazer o teste de integridade falhar com mensagem que cite a política de fim de linha quando o hash divergir por CRLF
      - Garantir no CI a verificação de `checksums.sha256` e documentar a política no guia de contribuição
    criterios:
      - A política está declarada em `.gitattributes` no repositório
      - O conteúdo semântico do golden set e o `checksums.sha256` ficam inalterados
      - Um clone com `core.autocrlf=true` valida os checksums (demonstrado em teste ou em job de CI)
      - Nenhum teste depende de conversão implícita de fim de linha
      - O CI valida a integridade do golden set
      - Revisado pelo Luiz e CI verde

  - id: S6-10
    titulo: Definir a matriz de sistemas suportados e tornar scripts e testes portáveis
    sprint: S6
    frente: F6
    responsaveis: [Maria Eduarda, Pedro]
    labels: [tipo:infra, prioridade:media]
    contexto: >-
